<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>html notes</title>
    <link rel="stylesheet" href="notes.css" />
  </head>
  <body>
    <h1>SVGS:</h1>
    <div class="svgs">
      <!-- 
          SVG image format
    SVG ares a scale image format, stands for (Scalable Vector Graphics)
    SVG source code is in XML (HTML-like syntax) which means its
    human readable, unlike a lot of other image formats.

    But, inefficient at storing complex images.

    -->
      <div class="svgContainer">
        <!-- xlmns is what dialect of XML we are using -->
        <!-- viewbox is the bounds of the SVG 
             first 2 numbers is where the top left of our image spawns
             last 2 numbers is the x and y value of the internal coord system.-->

        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300">
          <rect x="0" y="0" width="100" height="100" fill="burlywood" />
          <path
            d="M 10 10 H 90 V 90 L 10 60"
            fill="transparent"
            stroke="black"
            stroke-width="3"
          />
          <circle cx="50" cy="50" r="20" class="svg-circle" />
          <g class="svg-text-group">
            <text x="20" y="25" rotate="10" id="hello-text">Hello!</text>
            <use href="#hello-text" x="-10" y="65" fill="white" />
          </g>
        </svg>
      </div>

      <!-- https://www.joshwcomeau.com/svg/friendly-introduction-to-svg/
       all things svg -->
      <!-- 
      Primitives in SVG (like primitives in html, like <p> or <h2>)
        -->

      <!-- Lines:
    x1, y1 is the starting point of the line, x2, y2 is the end point
      -->
      <div class="svgContainer">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300">
          <line
            x1="80"
            y1="80"
            x2="200"
            y2="200"
            stroke="oklch(0.9 0.3 164)"
            stroke-width="5"
          />
        </svg>
      </div>

      <!-- Rectangles: 
    x, y is the top left corner
    width and height are well, width and height
    rx, ry are ways we can round corners
    rx is radius in the x-axis, ry is radius in the y-axis
     -->
      <div class="svgContainer">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300">
          <rect
            x="60"
            y="100"
            width="180"
            height="100"
            fill="none"
            stroke="oklch(0.9 0.3 164)"
            stroke-width="5"
          />
        </svg>
      </div>

      <!-- Circles
    radius r
    center point cx, cy
     -->
      <div class="svgContainer">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300">
          <circle
            cx="140"
            cy="140"
            r="70"
            fill="none"
            stroke="oklch(0.9 0.3 164)"
            stroke-width="5"
          />
        </svg>
      </div>

      <!-- Ellpises
    radius rx, ry
    center point cx, cy
     -->
      <div class="svgContainer">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300">
          <ellipse
            cx="150"
            cy="150"
            rx="75"
            ry="50"
            fill="none"
            stroke="oklch(0.9 0.3 164)"
            stroke-width="5"
          />
        </svg>
      </div>

      <!-- Polygons
    Can create any shape using x,y points
      -->

      <div class="svgContainer">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300">
          <polygon
            points="
            60,100
            100,180
            140,140
            180,180
            220,100
            "
            fill="none"
            stroke="oklch(0.9 0.3 164)"
            stroke-width="5"
          />
        </svg>
      </div>

      <!-- Attributes
    fill: fills the shape
    strokes: kind of like borders in html
      we can choose color, width, type of line (dashed, not dashed
      -->
    </div>

    <h1>Tables:</h1>
    <!-- Tables should only be used, well for tables. Never for layout  -->
    <!-- tr is a table row
         td is table data (generic tag for a box in a table)
         th is a table header -->
    <!-- attributes:
         rowspan/colspan how long a td is. A rowspan of 2 would make the td span two rows-->

    <!-- colgroup element right under the table tag to group cols
         col element to actually group them
         span attribute of the col element to grab more then one col -->

    <!-- caption element  right under the table tag
         adds a caption-->

    <!-- elements that make a table easy to style:
         thead element: wraps the header of the table
         tbody element: wraps the main body of the table
         tfoot element: wraps the foot of the table -->
    <table>
      <tr>
        <th>&nbsp;</th>
        <th>Knocky</th>
        <th>Flor</th>
        <th>Ella</th>
        <th>Juan</th>
      </tr>
      <tr>
        <th>Breed</th>
        <td>Jack Russell</td>
        <td>Poodle</td>
        <td>Streetdog</td>
        <td>Cocker Spaniel</td>
      </tr>
      <tr>
        <th>Age</th>
        <td>16</td>
        <td>9</td>
        <td>10</td>
        <td>5</td>
      </tr>
      <tr>
        <th>Owner</th>
        <td>Mother-in-law</td>
        <td colspan="2">Me</td>

        <td>Sister-in-law</td>
      </tr>
      <tr>
        <th>Eating Habits</th>
        <td>Eats everyone's leftovers</td>
        <td>Nibbles at food</td>
        <td>Hearty eater</td>
        <td>Will eat till he explodes</td>
      </tr>
    </table>

    <!-- 
    FORMS!!! ----------------------------------------------------------------
    A form element is a container which wraps all inputs a user will interact with/
    Two important attributes:
    action: takes a URL value which tells the form where the data should be sent.
    method: tells the browser which HTTP request method it should use.
            examples: GET method: when we want to retrieve something from a search
                      like a google search
                      POST method: when we want to change something from the server
                      like an account made
      
    Control elements in the form element: Ways the user interacts with the form.
    attributes:
    name: var name for the input in the backend

    Label element
    the for attribute needs a id of a control element
    <label for="first_name">First Name:</label>

    Input element
    <input type="text">
    attributes:
    type: type of input, like text, email, password, number, date.
  
                    
    Text area element
    a lil weird, search this up when u use it lol
    input box of text that can span multiple lines
    has a closing tag

    Select element
    Gives a dropdown list
    <select name="varName">
      <option value="mercedes">Mercedes</option>
      <option value="volvo">Volvo</option>
    </select>
    name is still the var name in the backend of the input,
    value is the actual value of the var name if the user selects that selection.
    We can split the list into catagories using the optgroup element.
    
    Radio buttons (input element with a type of radio)
    different radio button elements have the same name = they are in the same group
    checked attribute: selected by default.

    Checkboxes (input element with a type of checkbox)
    works similarly to radio buttons, but more then one option can be selected

    Buttons
    Submit type: buttons that are a submit form
    Reset type: buttons that resets form
    Generic button: (type="button") just for general things


    Organizing form elements

    Fieldset element: groups related form input elements
    Legend element: a caption/heading within the form


    Validations:
    required attribute: makes sure the form cannot be submitted unless this is filled out
    minlength/maxlength attribute: the min/max length of this form via int
    min/max: min/max number values of a number input
    pattern: makes sure the input follows a certain pattern (like zipcode, card numbers, etc)

    :user-valid, :user-invalid pseudo-classes for css styling
    -->
  </body>
</html>
